name: Dashboard-Passwörter aktualisieren

on:
  workflow_dispatch:

permissions: {}

jobs:
  passwoerter-uebertragen:
    name: Passwörter sicher übertragen
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    env:
      FCG_LEADERSHIP_PASSWORD: ${{ secrets.FCG_LEADERSHIP_PASSWORD }}
      FCG_STAFF_PASSWORD: ${{ secrets.FCG_STAFF_PASSWORD }}
      FCG_GENERAL_PASSWORD: ${{ secrets.FCG_GENERAL_PASSWORD }}
      DASHBOARD_URL: https://fcg-leitungsdashboard.ronjarubens.chatgpt.site
    steps:
      - name: Neue Passwörter an das Dashboard senden
        shell: bash
        run: |
          node <<'NODE'
          const required = [
            "FCG_LEADERSHIP_PASSWORD",
            "FCG_STAFF_PASSWORD",
            "FCG_GENERAL_PASSWORD"
          ];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) throw new Error(`Fehlende GitHub-Secrets: ${missing.join(", ")}`);

          const passwordValues = required.map(name => process.env[name]);
          if (passwordValues.some(value => value.length < 12 || value.length > 256)) {
            throw new Error("Jedes Passwort muss 12 bis 256 Zeichen lang sein.");
          }
          if (new Set(passwordValues).size !== passwordValues.length) {
            throw new Error("Für jeden Bereich muss ein anderes Passwort verwendet werden.");
          }

          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidcUrl.searchParams.set("audience", "fcg-dashboard-password-sync");
          const oidcResponse = await fetch(oidcUrl, {
            headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }
          });
          if (!oidcResponse.ok) throw new Error(`GitHub-OIDC konnte nicht erstellt werden (${oidcResponse.status}).`);
          const { value: oidcToken } = await oidcResponse.json();

          const response = await fetch(`${process.env.DASHBOARD_URL}/api/admin/sync-passwords`, {
            method: "POST",
            headers: {
              authorization: `Bearer ${oidcToken}`,
              "content-type": "application/json"
            },
            body: JSON.stringify({
              leadership: process.env.FCG_LEADERSHIP_PASSWORD,
              staff: process.env.FCG_STAFF_PASSWORD,
              general: process.env.FCG_GENERAL_PASSWORD
            })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || `Dashboard antwortete mit Status ${response.status}.`);
          console.log("Die drei Dashboard-Passwörter wurden erfolgreich aktualisiert.");
          NODE
